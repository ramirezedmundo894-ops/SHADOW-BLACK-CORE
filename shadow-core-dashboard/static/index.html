<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SHADOW CORE · Demo de auditoría</title>
  <style>body{background:#000;color:#fff;font-family:monospace;padding:1.5rem}.card{border:1px solid #444;padding:1rem;margin:.5rem 0}input{display:block;margin:.5rem 0;width:min(100%,36rem);padding:.5rem}</style>
</head>
<body>
  <h1>SHADOW CORE · Demo de auditoría</h1>
  <p>Este prototipo no contiene telemetría de producción ni resultados de pruebas verificados.</p>
  <div id="stats" class="card">Cargando…</div>
  <h2>Resultados de pruebas</h2><div id="tests"></div>
  <h2>Datos económicos</h2><div id="economia" class="card"></div>
  <h2>Registrar acción (demo, no persistida)</h2>
  <input id="accion" maxlength="500" placeholder="Acción de mejora" />
  <input id="test_rel" maxlength="200" placeholder="Prueba relacionada" />
  <button id="save">Enviar</button>
  <script src="/app.js" defer></script>
</body>
</html>
