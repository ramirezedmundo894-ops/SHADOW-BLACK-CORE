# Local development slice only. Not a production deployment manifest.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadow_core
      POSTGRES_USER: shadow_core
      POSTGRES_PASSWORD: ${SHADOW_POSTGRES_PASSWORD:?set SHADOW_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - shadow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadow_core -d shadow_core"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - shadow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  go-policy:
    build:
      context: ./shadow-core-go
    environment:
      SHADOW_GO_ADDR: ":8081"
      SHADOW_GO_INTERNAL_TOKEN: ${SHADOW_GO_INTERNAL_TOKEN:?set SHADOW_GO_INTERNAL_TOKEN in .env}
      SHADOW_POSTGRES_DSN: postgres://shadow_core:${SHADOW_POSTGRES_PASSWORD}@postgres:5432/shadow_core?sslmode=disable
      SHADOW_REDIS_URL: redis://redis:6379/0
      SHADOW_REDIS_STREAM: shadow:decision-events
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/shadow-core-go", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  shadow-postgres-data:
  shadow-redis-data:
